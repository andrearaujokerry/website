name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Check, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Unit and component tests
        run: npm test
      - name: Build
        run: npm run build
      # Checks on the built site (WORKPLAN.md, Phase 6). Chrome comes with the runner.
      - name: Site tests (pages, behaviour, layout and accessibility, in Chrome)
        run: npm run test:site
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Links and #fragments
        run: npm run check:links
      - name: HTML validation
        run: npm run check:html
      - name: Lighthouse (mobile scores, Core Web Vitals and page-weight budgets)
        run: npm run lighthouse
      - name: Keep the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
